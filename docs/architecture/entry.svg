<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1370" width="1600" height="1370" role="group" aria-label="对话与控制入口" data-architecture-view="entry" font-family="Microsoft YaHei, Segoe UI, sans-serif"><title>Pilot · 对话与控制入口</title><desc>原生工作区选择、用户消息和Owner任务操作三条路径；工作区目录与领域执行目录明确区分。</desc><rect width="1600" height="1370" rx="16" fill="#fbfcfd" /><defs><marker id="pilot_entry_flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386b55" /></marker><marker id="pilot_entry_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7f9e" /></marker><marker id="pilot_entry_event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47b43" /></marker><marker id="pilot_entry_control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b71a7" /></marker></defs><g data-architecture-boundary="input_client" data-boundary-kind="client" role="group" aria-label="用户输入端"><title>入口边界 · 用户控制端：输入或选择目录；不直接执行业务负载</title><rect x="15" y="45" width="290" height="520" rx="16" fill="#faf8f1" fill-opacity=".5" stroke="#a08b59" stroke-width="2" stroke-dasharray="none" /><g><text x="33" y="71" font-size="16" font-weight="650" text-anchor="start" fill="#a08b59">用户输入端</text><text x="33" y="94" font-size="12" font-weight="400" text-anchor="start" fill="#a08b59">输入或选择目录；不直接执行业务负载</text></g></g><g data-architecture-boundary="browse_client" data-boundary-kind="client" role="group" aria-label="Web · 原生目录交互"><title>入口边界 · 用户控制端：目录列表由Host返回</title><rect x="330" y="45" width="300" height="230" rx="16" fill="#faf8f1" fill-opacity=".5" stroke="#a08b59" stroke-width="2" stroke-dasharray="none" /><g><text x="348" y="71" font-size="16" font-weight="650" text-anchor="start" fill="#a08b59">Web · 原生目录交互</text><text x="348" y="94" font-size="12" font-weight="400" text-anchor="start" fill="#a08b59">目录列表由Host返回</text></g></g><g data-architecture-boundary="inbox_host" data-boundary-kind="host" role="group" aria-label="Host · 原生Inbox"><title>执行位置 · 可信Host程序：用户输入进入turn</title><rect x="330" y="345" width="300" height="220" rx="16" fill="#f5faf7" fill-opacity=".5" stroke="#54896a" stroke-width="2" stroke-dasharray="none" /><g><text x="348" y="371" font-size="16" font-weight="650" text-anchor="start" fill="#54896a">Host · 原生Inbox</text><text x="348" y="394" font-size="12" font-weight="400" text-anchor="start" fill="#54896a">用户输入进入turn</text></g></g><g data-architecture-boundary="entry_host" data-boundary-kind="host" role="group" aria-label="Host · 会话、工作区与业务入口"><title>执行位置 · 可信Host程序：目录服务与登记在Host；新根历史隔离</title><rect x="650" y="45" width="935" height="545" rx="16" fill="#f5faf7" fill-opacity=".5" stroke="#54896a" stroke-width="2" stroke-dasharray="none" /><g><text x="668" y="71" font-size="18" font-weight="650" text-anchor="start" fill="#54896a">Host · 会话、工作区与业务入口</text><text x="668" y="94" font-size="14" font-weight="400" text-anchor="start" fill="#54896a">目录服务与登记在Host；新根历史隔离</text></g></g><g data-architecture-boundary="manual_client" data-boundary-kind="client" role="group" aria-label="Owner手动控制端"><title>入口边界 · 用户控制端：按钮发起确切请求，仍须Host校验</title><rect x="15" y="870" width="325" height="230" rx="16" fill="#faf8f1" fill-opacity=".5" stroke="#a08b59" stroke-width="2" stroke-dasharray="none" /><g><text x="33" y="896" font-size="16" font-weight="650" text-anchor="start" fill="#a08b59">Owner手动控制端</text><text x="33" y="919" font-size="12" font-weight="400" text-anchor="start" fill="#a08b59">按钮发起确切请求，仍须Host校验</text></g></g><g data-architecture-boundary="manual_host" data-boundary-kind="host" role="group" aria-label="Host · 状态校验与会话控制"><title>执行位置 · 可信Host程序：保存草稿/唤醒/中断是不同分支；不绕过授权</title><rect x="405" y="670" width="1180" height="605" rx="16" fill=