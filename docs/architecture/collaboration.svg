<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 3220" width="1120" height="3220" role="group" aria-label="主控与专家协作" data-architecture-view="collaboration" font-family="Microsoft YaHei, Segoe UI, sans-serif"><title>Pilot · 主控与专家协作</title><desc>默认auto先由Pilot主控处理，按证据使用零位、一位或先后两位专家。</desc><rect width="1120" height="3220" rx="16" fill="#fbfcfd" /><defs><marker id="pilot_collaboration_flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386b55" /></marker><marker id="pilot_collaboration_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7f9e" /></marker><marker id="pilot_collaboration_event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47b43" /></marker><marker id="pilot_collaboration_control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b71a7" /></marker></defs><g data-architecture-boundary="family_scope" data-boundary-kind="session" role="group" aria-label="同根会话族 · 主控与按需专家"><title>数据范围 · 会话作用域：共享根任务预算、领域状态与根MCP；最多一位活动专家</title><rect x="30" y="2040" width="1060" height="1090" rx="16" fill="#f7f5fc" fill-opacity=".5" stroke="#9784b2" stroke-width="2" stroke-dasharray="9 5" /><g><text x="48" y="2066" font-size="18" font-weight="650" text-anchor="start" fill="#9784b2">同根会话族 · 主控与按需专家</text><text x="48" y="2089" font-size="14" font-weight="400" text-anchor="start" fill="#9784b2">共享根任务预算、领域状态与根MCP；最多一位活动专家</text></g></g><g data-architecture-boundary="s2_root_scope" data-boundary-kind="session" role="group" aria-label="父会话 · 独立上下文"><title>数据范围 · 会话作用域：角色工具单独准入；会话边界不授予宿主权限</title><rect x="65.0" y="2125" width="405" height="920" rx="16" fill="#f7f5fc" fill-opacity=".5" stroke="#9784b2" stroke-width="2" 