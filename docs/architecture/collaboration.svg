.0 2415 L 265.0 2495" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_collaboration_flow)" /><path d="M 850.0 2415 L 850.0 2495" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_collaboration_flow)" /><path d="M 850.0 2595 L 850.0 2675" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_collaboration_flow)" /><path d="M 685.0 2722.5 L 430.0 2722.5" fill="none" stroke="#b47b43" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_collaboration_event)" stroke-dasharray="6 5" /><path d="M 265.0 2770 L 265.0 2885" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_collaboration_flow)" /><g data-architecture-node="s0_lead" data-architecture-component="lead" role="button" tabindex="0" aria-label="Pilot主控，查看职责" style="cursor:pointer"><rect x="410.0" y="115" width="300" height="110" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="560.0" y="164.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">Pilot主控</text><text x="560.0" y="195.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">监督协调 +Infra执行</text></g><g data-architecture-node="s0_facts" data-architecture-component="facts" role="button" tabindex="0" aria-label="当前证据与协作偏好，查看职责" style="cursor:pointer"><rect x="40.0" y="435" width="240" height="100" rx="12" fill="#f1edfa" stroke="#aa97c2" stroke-width="1.7" /><text x="160.0" y="479.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">当前证据与协作偏好</text><text x="160.0" y="510.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">事件ID /故障层 /strategy</text></g><g data-architecture-node="s0_route" data-architecture-component="route" role="button" tabindex="0" aria-label="程序计算专家准入，查看职责" style="cursor:pointer"><rect x="410.0" y="435" width="300" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="560.0" y="479.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">程序计算专家准入</text><text x="560.0" y="510.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">许可 ≠ 已实际参与</text></g><g data-architecture-node="s0_infra" data-architecture-target="tools_system" role="button" tabindex="0" aria-label="Infra专家，打开设计" style="cursor:pointer"><rect x="50.0" y="585" width="240" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="170.0" y="629.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">Infra专家</text><text x="170.0" y="660.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">只读环境、资源与实验分析</text></g><g data-architecture-node="s0_repo" data-architecture-target="tools_system" role="button" tabindex="0" aria-label="Repo专家，打开设计" style="cursor:pointer"><rect x="760.0" y="585" width="240" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="880.0" y="629.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">Repo专家</text><text x="880.0" y="660.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">获准源码修复与真实SHA</text></g><g data-architecture-node="s0_policy" data-architecture-target="governance" role="button" tabindex="0" aria-label="权限、并发与预算，打开设计" style="cursor:pointer"><rect x="410.0" y="725" width="300" height="100" rx="12" fill="#fff5e3" stroke="#c4a461" stroke-width="1.7" /><text x="560.0" y="769.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">权限、并发与预算</text><text x="560.0" y="800.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">根/子会话共享额度</text></g><g data-architecture-node="s1_events" data-architecture-component="facts" role="button" tabindex="0" aria-label="当前故障证据，查看职责" style="cursor:pointer"><rect x="60.0" y="1080" width="290" height="100" rx="12" fill="#f1edfa" stroke="#aa97c2" stroke-width="1.7" /><text x="205.0" y="1124.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">当前故障证据</text><text x="205.0" y="1155.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">成功复验后的旧触发已消解</text></g><g data-architecture-node="s1_pref" data-architecture-component="route" role="button" tabindex="0" aria-label="协作偏好，查看职责" style="cursor:pointer"><rect x="770.0" y="1080" width="290" height="100" rx="12" fill="#fff5e3" stroke="#c4a461" stroke-width="1.7" /><text x="915.0" y="1124.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">协作偏好</text><text x="915.0" y="1155.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">single /auto /multi</text></g><g data-architecture-node="s1_rules" data-architecture-component="route" role="button" tabindex="0" aria-label="证据路由规则，查看职责" style="cursor:pointer"><rect x="385.0" y="1310" width="350" height="110" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="560.0" y="1359.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">证据路由规则</text><text x="560.0" y="1390.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">环境/运行、源码、跨层</text></g><g data-architecture-node="s1_admit" data-architecture-component="route" role="button" tabindex="0" aria-label="专家许可？，查看职责" style="cursor:pointer"><path d="M 560.0 1510 L 680.0 1565.0 L 560.0 1620 L 440.0 1565.0 Z" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="560.0" y="1559.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">专家许可？</text><text x="560.0" y="1582.0" font-size="14" font-weight="400" text-anchor="middle" fill="#647987">规则许可，不自动调用</text></g><g data-architecture-node="s1_solo" data-architecture-component="lead" role="button" tabindex="0" aria-label="主控独立执行，查看职责" style="cursor:pointer"><rect x="60.0" y="1745" width="290" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="205.0" y="1789.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">主控独立执行</text><text x="205.0" y="1820.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">single或无待处理证据</text></g><g data-architecture-node="s1_special" data-architecture-component="native_child" role="button" tabindex="0" aria-label="主控按需派发专家，查看职责" style="cursor:pointer"><rect x="770.0" y="1745" width="290" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="915.0" y="1789.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">主控按需派发专家</text><text x="915.0" y="1820.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">仍须权限/并发/预算守卫</text></g><g data-architecture-node="s2_call" data-architecture-component="lead" role="button" tabindex="0" aria-label="主控委派 /复用请求，查看职责" style="cursor:pointer"><rect x="100.0" y="2195" width="330" height="95" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="265.0" y="2236.5" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">主控委派 /复用请求</text><text x="265.0" y="2267.5" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">聚焦证据、问题或补丁目标</text></g><g data-architecture-node="s2_guard" data-architecture-component="policy" role="button" tabindex="0" aria-label="准入 /角色 /状态守卫，查看职责" style="cursor:pointer"><rect x="100.0" y="2315" width="330" height="100" rx="12" fill="#fff5e3" stroke="#c4a461" stroke-width="1.7" /><text x="265.0" y="2359.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">准入 /角色 /状态守卫</text><text x="265.0" y="2390.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">根共享预算 ·最多1活跃</text></g><g data-architecture-node="s2_child" data-architecture-component="native_child" role="button" tabindex="0" aria-label="原生创建或send_message，查看职责" style="cursor:pointer"><rect x="685.0" y="2315" width="330" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="850.0" y="2359.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">原生创建或send_message</text><text x="850.0" y="2390.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">同角色复用已有子会话</text></g><g data-architecture-node="s2_work" data-architecture-component="expert_message" role="button" tabindex="0" aria-label="专家在自己的Loop中工作，查看职责" style="cursor:pointer"><rect x="685.0" y="2495" width="330" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="850.0" y="2539.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">专家在自己的Loop中工作</text><text x="850.0" y="2570.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">角色工具 +上下文 +历史</text></g><g data-architecture-node="s2_send" data-architecture-component="expert_message" role="button" tabindex="0" aria-label="回传父会话并结束turn，查看职责" style="cursor:pointer"><rect x="685.0" y="2675" width="330" height="95" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="850.0" y="2716.5" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">回传父会话并结束turn</text><text x="850.0" y="2747.5" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">证据ID /实验建议 /源码SHA</text></g><g data-architecture-node="s2_wait" data-architecture-component="turn_end" role="button" tabindex="0" aria-label="主控结束turn等待，查看职责" style="cursor:pointer"><rect x="100.0" y="2495" width="330" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="265.0" y="2539.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">主控结束turn等待</text><text x="265.0" y="2570.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">等待原生消息/完成</text></g><g data-architecture-node="s2_notice" data-architecture-component="wake" role="button" tabindex="0" aria-label="原生通知激活原根，查看职责" style="cursor:pointer"><rect x="100.0" y="2675" width="330" height="95" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="265.0" y="2716.5" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">原生通知激活原根</text><text x="265.0" y="2747.5" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">新turn恢复当前进度</text></g><g data-architecture-node="s2_next" data-architecture-target="loop" role="button" tabindex="0" aria-label="主控继续决策，打开设计" style="cursor:pointer"><rect x="100.0" y="2885" width="330" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="265.0" y="2929.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">主控继续决策</text><text x="265.0" y="2960.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">候选/Job/验收仍由主控负责</text></g><text x="560.0" y="28" font-size="23" font-weight="400" text-anchor="middle" fill="#6b7f8d">模块总览</text><text x="560.0" y="876" font-size="16" font-weight="400" text-anchor="middle" fill="#6b7f8d">默认auto从主控开始；需要时使用一位或先后两位专家，最多1个活跃子会话。</text><text x="560.0" y="1008" font-size="23" font-weight="400" text-anchor="middle" fill="#6b7f8d">故障证据与专家准入</text><text x="560.0" y="1883" font-size="16" font-weight="400" text-anchor="middle" fill="#6b7f8d">multi无明确源码证据时先准入Infra；跨层证据可先后使用两专家。</text><text x="560.0" y="2008" font-size="23" font-weight="400" text-anchor="middle" fill="#6b7f8d">原生子会话与结论回传</text><text x="560" y="3180" font-size="16" font-weight="400" text-anchor="middle" fill="#6b7f8d">独立子会话 ≠ 独立OS沙箱。MCP按根会话族隔离，不为每位专家重复创建容器。</text></svg>
