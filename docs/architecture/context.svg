cture-target="tools_system" role="button" tabindex="0" aria-label="角色工具Schema，打开设计" style="cursor:pointer"><rect x="925.0" y="100" width="250" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="1050.0" y="144.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">角色工具Schema</text><text x="1050.0" y="175.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">当前可见工具与参数</text></g><g data-architecture-node="s0_assemble" data-architecture-component="assemble" role="button" tabindex="0" aria-label="原生上下文组装，查看职责" style="cursor:pointer"><rect x="400.0" y="425" width="400" height="125" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="600.0" y="481.5" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">原生上下文组装</text><text x="600.0" y="512.5" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">systemPrompt + messages + tools</text></g><g data-architecture-node="s0_model" data-architecture-target="loop" role="button" tabindex="0" aria-label="本step模型请求，打开设计" style="cursor:pointer"><rect x="400.0" y="725" width="400" height="110" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="600.0" y="774.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">本step模型请求</text><text x="600.0" y="805.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">主控或专家读取作用域内输入</text></g><g data-architecture-node="s1_step_0" data-architecture-component="facts_load" role="button" tabindex="0" aria-label="agent/pre-step边界，查看职责" style="cursor:pointer"><rect x="420.0" y="1070" width="360" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="600.0" y="1114.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">agent/pre-step边界</text><text x="600.0" y="1145.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">根身份、角色、有界投影</text></g><g data-architecture-node="s1_step_1" data-architecture-target="memory" role="button" tabindex="0" aria-label="按根Session与角色读取，打开设计" style="cursor:pointer"><rect x="420.0" y="1215" width="360" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="600.0" y="1259.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">按根Session与角色读取</text><text x="600.0" y="1290.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">结构化请求与结果</text></g><g data-architecture-node="s1_step_2" data-architecture-component="facts" role="button" tabindex="0" aria-label="更新required事实文本，查看职责" style="cursor:pointer"><rect x="420.0" y="1360" width="360" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="600.0" y="1404.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">更新required事实文本</text><text x="600.0" y="1435.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">状态、候选、证据、预算</text></g><g data-architecture-node="s1_step_3" data-architecture-target="loop" role="button" tabindex="0" aria-label="原生组装本step输入，打开设计" style="cursor:pointer"><rect x="420.0" y="1505" width="360" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="600.0" y="1549.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">原生组装本step输入</text><text x="600.0" y="1580.0" font-size="16" font-weight="400" text-anchor="middle" fill="#647987">规则 + 历史 + 最新事实 + 工具</text></g><g data-architecture-node="s2_history" data-architecture-component="history" role="button" tabindex="0" aria-label="原生完整会话历史，查看职责" style="cursor:pointer"><path d="M 450.0 1887 C 450.0 1871 750.0 1871 750.0 1887 L 750.0 1973 C 750.0 1989 450.0 1989 450.0 1973 Z" fill="#f1edfa" stroke="#aa97c2" stroke-width="1.7" /><path d="M 450.0 1887 C 450.0 1903 750.0 1903 750.0 1887" fill="none" stroke="#aa97c2" stroke-width="1.4" /><text x="600.0" y="1924.0" font-size="22" font-weight="650" text-anchor="middle" fill="#243c49">原生完整会话历史</text><text x=