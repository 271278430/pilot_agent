b55" paint-order="stroke" stroke="#fbfcfd" stroke-width="6" stroke-linejoin="round">分类/相关业务</text><path d="M 1360 1160 L 1360 1330 L 970 1330" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_model_access_flow)" /><path d="M 100 230 L 40 230 L 40 890 L 100 890" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_model_access_flow)" /><path d="M 260 940 L 260 1060" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_model_access_flow)" /><path d="M 260 1160 L 260 1280" fill="none" stroke="#386b55" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_model_access_flow)" /><path d="M 810 1160 L 810 1280" fill="none" stroke="#5d7f9e" stroke-width="2" stroke-linejoin="round" marker-end="url(#pilot_model_access_data)" stroke-dasharray="6 5" /><text x="860" y="1220" font-size="16" font-weight="400" text-anchor="middle" fill="#5d7f9e" paint-order="stroke" stroke="#fbfcfd" stroke-width="6" stroke-linejoin="round">固定回复</text><g data-architecture-node="owner" data-architecture-component="host_settings" role="button" tabindex="0" aria-label="设置 / 会话选模，查看职责" style="cursor:pointer"><rect x="100" y="180" width="320" height="100" rx="12" fill="#fff5e3" stroke="#c4a461" stroke-width="1.7" /><text x="260.0" y="224.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">设置 / 会话选模</text><text x="260.0" y="255.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">Web与CLI；Owner配置入口</text></g><g data-architecture-node="input" data-architecture-component="user" role="button" tabindex="0" aria-label="文字与图片输入，查看职责" style="cursor:pointer"><rect x="650" y="180" width="320" height="100" rx="12" fill="#fff5e3" stroke="#c4a461" stroke-width="1.7" /><text x="810.0" y="224.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">文字与图片输入</text><text x="810.0" y="255.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">原生附件上传；PNG/JPEG/WebP/GIF</text></g><g data-architecture-node="catalog" data-architecture-component="host_settings" role="button" tabindex="0" aria-label="已应用模型目录，查看职责" style="cursor:pointer"><rect x="100" y="400" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="260.0" y="444.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">已应用模型目录</text><text x="260.0" y="475.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">独立provider / Key / 容量 / 图片能力</text></g><g data-architecture-node="admission" data-architecture-component="image_admission" role="button" tabindex="0" aria-label="原生图片准入与保存，查看职责" style="cursor:pointer"><rect x="650" y="400" width="320" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="810.0" y="444.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">原生图片准入与保存</text><text x="810.0" y="475.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">能力与限额校验；归一化、持久引用</text></g><g data-architecture-node="choice" data-architecture-component="session" role="button" tabindex="0" aria-label="原生会话选模API，查看职责" style="cursor:pointer"><rect x="100" y="620" width="320" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="260.0" y="664.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">原生会话选模API</text><text x="260.0" y="695.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">选择写入本Session；默认另行设置</text></g><g data-architecture-node="session" data-architecture-component="session" role="button" tabindex="0" aria-label="原生根会话，查看职责" style="cursor:pointer"><rect x="650" y="620" width="320" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="810.0" y="664.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">原生根会话</text><text x="810.0" y="695.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">model-selection / 消息 / 图片引用</text></g><g data-architecture-node="resources" data-architecture-component="resource_paths" role="button" tabindex="0" aria-label="主控与各节点资源根，查看职责" style="cursor:pointer"><rect x="100" y="840" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="260.0" y="884.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">主控与各节点资源根</text><text x="260.0" y="915.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">主控本机目录 / 节点数据盘与所有权</text></g><g data-architecture-node="assemble" data-architecture-target="context" role="button" tabindex="0" aria-label="原生上下文组装，打开设计" style="cursor:pointer"><rect x="650" y="840" width="320" height="100" rx="12" fill="#edf3fb" stroke="#91a9c6" stroke-width="1.7" /><text x="810.0" y="884.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">原生上下文组装</text><text x="810.0" y="915.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">同会话意图 / 事实 / 图片投影 / 压缩</text></g><g data-architecture-node="snapshot" data-architecture-component="node_prepare" role="button" tabindex="0" aria-label="准备操作与固定路径，查看职责" style="cursor:pointer"><rect x="100" y="1060" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="260.0" y="1104.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">准备操作与固定路径</text><text x="260.0" y="1135.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">资产ID / 版本 / 目录 / 校验 / 容量</text></g><g data-architecture-node="client" data-architecture-component="model_call" role="button" tabindex="0" aria-label="原生LLM / Pilot响应门，查看职责" style="cursor:pointer"><rect x="650" y="1060" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="810.0" y="1104.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">原生LLM / Pilot响应门</text><text x="810.0" y="1135.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">分类与业务派发；无关固定流</text></g><g data-architecture-node="endpoint" data-architecture-component="control_api" role="button" tabindex="0" aria-label="已选择的控制模型API，查看职责" style="cursor:pointer"><rect x="1200" y="1060" width="320" height="100" rx="12" fill="#ffffff" stroke="#a8b7bf" stroke-width="1.7" /><text x="1360.0" y="1104.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">已选择的控制模型API</text><text x="1360.0" y="1135.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">接收文本+图片；响应不能授予权限</text></g><g data-architecture-node="download" data-architecture-target="execution" role="button" tabindex="0" aria-label="节点调用 / 下载审批，打开设计" style="cursor:pointer"><rect x="100" y="1280" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="260.0" y="1324.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">节点调用 / 下载审批</text><text x="260.0" y="1355.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">固定SSH桥；下载执行见领域图</text></g><g data-architecture-node="loop" data-architecture-target="loop" role="button" tabindex="0" aria-label="Pilot主控与原生Loop，打开设计" style="cursor:pointer"><rect x="650" y="1280" width="320" height="100" rx="12" fill="#e9f6ef" stroke="#77a98c" stroke-width="1.7" /><text x="810.0" y="1324.0" font-size="21" font-weight="650" text-anchor="middle" fill="#243c49">Pilot主控与原生Loop</text><text x="810.0" y="1355.0" font-size="13" font-weight="400" text-anchor="middle" fill="#647987">回复 / 澄清 / 获准工具 / 专家</text></g></svg>
