<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1620 1500" width="1620" height="1500" role="group" aria-label="模型、图片与资源路径" data-architecture-view="model_access" font-family="Microsoft YaHei, Segoe UI, sans-serif"><title>Pilot · 模型、图片与资源路径</title><desc>模型登记、原生会话选模与图片链路；受管下载路径同图展开。</desc><rect width="1620" height="1500" rx="16" fill="#fbfcfd" /><defs><marker id="pilot_model_access_flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#386b55" /></marker><marker id="pilot_model_access_data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5d7f9e" /></marker><marker id="pilot_model_access_event" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47b43" /></marker><marker id="pilot_model_access_control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8b71a7" /></marker></defs><g data-architecture-boundary="browser" data-boundary-kind="client" role="group" aria-label="用户客户端 · 原生输入与设置UI"><title>入口边界 · 用户控制端：图片/Key通过明确选择的Host/API路径处理</title><rect x="60" y="100" width="1010" height="210" rx="16" fill="#faf8f1" fill-opacity=".5" stroke="#a08b59" stroke-width="2" stroke-dasharray="none" /><g><text x="78" y="126" font-size="18" font-weight="650" text-anchor="start" fill="#a08b59">用户客户端 · 原生输入与设置UI</text><text x="78" y="149" font-size="13" font-weight="400" text-anchor="start" fill="#a08b59">图片/Key通过明确选择的Host/API路径处理</text></g></g><g data-architecture-boundary="host" data-boundary-kind="host" role="group" aria-label="可信 Pilot Host"><title>执行位置 · 可信Host程序：配置与会话控制程序</title><rect x="60" y="340" width="1010" height="1100" rx="16" fill="#f5faf7" fill-opacity=".5" stroke="#54896a" stroke-width="2" stroke-dasharray="none" /><g><tex