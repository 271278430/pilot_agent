name: Pilot checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix harness/runtime --no-audit --no-fund
      - run: |
          python -m venv .venv
          mkdir -p .cache/build
          .venv/bin/python -m pip install -r requirements.lock -e '.[dev]'
      - run: .venv/bin/python scripts/full_project_check.py --report-dir reports/ci-full-project-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: reports/ci-full-project-check/
